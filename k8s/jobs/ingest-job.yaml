# A03 A1/A2/F2: one ingestion run (verify -> update lake -> incremental index) into the live
# collection; same pod template as the ingest CronJob. Re-run with:
# kubectl delete job ingest-run -n rahbar --ignore-not-found && kubectl apply -f k8s/jobs/ingest-job.yaml
apiVersion: batch/v1
kind: Job
metadata:
  name: ingest-run
  namespace: rahbar
spec:
  backoffLimit: 2
  parallelism: 1
  completions: 1
  template:
    metadata:
      labels:
        app: indexer
    spec:
      serviceAccountName: rahbar-indexer
      automountServiceAccountToken: false
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: ingest
          image: rahbar-indexer:3.0.0
          imagePullPolicy: IfNotPresent
          args: ["python", "-m", "pipeline.run"]
          envFrom:
            - configMapRef:
                name: rahbar-config
          env:
            - name: INGEST_MODE
              value: "sync"
          resources:
            requests:
              cpu: "500m"
              memory: "768Mi"   # F5: ingest peak 1085Mi during OCR
            limits:
              cpu: "2"
              memory: "2Gi"
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - { name: data, mountPath: /data }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: datalake-pvc
        - name: tmp
          emptyDir: {}
