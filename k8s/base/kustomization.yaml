# kubectl apply -k k8s/base   (see k8s/README.md for the full order and the extra commands)
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - serviceaccount.yaml
  - configmap.yaml
  - configmap-gate.yaml
  - pvc.yaml
  - chroma-statefulset.yaml
  - redis-deployment.yaml
  - api-deployment.yaml
  - ui-deployment.yaml
  - services.yaml
  - ingress.yaml
  - ingest-cronjob.yaml
  - networkpolicy.yaml
  - hpa.yaml
