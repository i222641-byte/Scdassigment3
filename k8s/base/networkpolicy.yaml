# Deny by default, then allow only the paths the architecture needs (A02 4.7, A03 F2).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: rahbar
spec:
  podSelector: {}
  policyTypes: ["Ingress", "Egress"]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns
  namespace: rahbar
spec:
  podSelector: {}
  policyTypes: ["Egress"]
  egress:
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - { port: 53, protocol: UDP }
        - { port: 53, protocol: TCP }
---
# ui: from the ingress controller; no egress except DNS (the browser calls /api itself)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ui
  namespace: rahbar
spec:
  podSelector:
    matchLabels: { app: ui }
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: ingress-nginx }
      ports: [{ port: 8080 }]
---
# query APIs (live and candidate): from ingress, ui and the eval Job; to chroma, redis, Ollama
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-query-api
  namespace: rahbar
spec:
  podSelector:
    matchLabels: { role: query-api }
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: ingress-nginx }
        - podSelector:
            matchLabels: { app: ui }
        - podSelector:
            matchLabels: { app: eval }
      ports: [{ port: 8000 }]
    - from:                           # kubectl port-forward for /metrics (F4) arrives via the node
        - ipBlock: { cidr: 0.0.0.0/0 }
      ports: [{ port: 8000 }]
  egress:
    - to:
        - podSelector:
            matchLabels: { app: chroma }
      ports: [{ port: 8000 }]
    - to:
        - podSelector:
            matchLabels: { app: redis }
      ports: [{ port: 6379 }]
    - to:                             # Ollama on the laptop (host.minikube.internal), port only
        - ipBlock: { cidr: 0.0.0.0/0 }
      ports: [{ port: 11434 }]
---
# chroma: only the query APIs (read) and the ingestion Job (the single writer)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-chroma
  namespace: rahbar
spec:
  podSelector:
    matchLabels: { app: chroma }
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels: { role: query-api }
        - podSelector:
            matchLabels: { app: indexer }
      ports: [{ port: 8000 }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-redis
  namespace: rahbar
spec:
  podSelector:
    matchLabels: { app: redis }
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels: { role: query-api }
      ports: [{ port: 6379 }]
---
# ingestion Job: to chroma and Ollama (embeddings) only
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-indexer
  namespace: rahbar
spec:
  podSelector:
    matchLabels: { app: indexer }
  policyTypes: ["Egress"]
  egress:
    - to:
        - podSelector:
            matchLabels: { app: chroma }
      ports: [{ port: 8000 }]
    - to:
        - ipBlock: { cidr: 0.0.0.0/0 }
      ports: [{ port: 11434 }]
---
# eval Job: to the query APIs (black-box testing) and Ollama (judge, embeddings); never chroma
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-eval
  namespace: rahbar
spec:
  podSelector:
    matchLabels: { app: eval }
  policyTypes: ["Egress"]
  egress:
    - to:
        - podSelector:
            matchLabels: { role: query-api }
      ports: [{ port: 8000 }]
    - to:
        - ipBlock: { cidr: 0.0.0.0/0 }
      ports: [{ port: 11434 }]
