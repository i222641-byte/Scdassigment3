# One ServiceAccount per workload; none of them call the Kubernetes API, so no tokens.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: rahbar-api
  namespace: rahbar
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: rahbar-indexer
  namespace: rahbar
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: rahbar-eval
  namespace: rahbar
automountServiceAccountToken: false
