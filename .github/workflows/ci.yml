name: CI
on:
  push:
    branches: [dev]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff mypy
      - run: ruff check api/app indexer/pipeline
      - run: mypy api/app --ignore-missing-imports

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install API deps
        working-directory: api
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Run API tests
        working-directory: api
        run: pytest tests/ -v --cov=app --cov-report=term-missing --cov-fail-under=60
      - name: Install indexer deps
        working-directory: indexer
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Run indexer tests
        working-directory: indexer
        run: pytest tests/ -v

  manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install kustomize
        run: |
          curl -s "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash
          sudo mv kustomize /usr/local/bin/
      - name: Install kubeconform
        run: |
          curl -sL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar xz
          sudo mv kubeconform /usr/local/bin/
      - name: Validate manifests
        run: kustomize build k8s/overlays/prod | kubeconform -strict -summary

  build:
    runs-on: ubuntu-latest
    needs: [lint, test, manifests]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build api image
        uses: docker/build-push-action@v6
        with:
          context: api
          push: false
          tags: rahbar-api:ci
      - name: Build indexer image
        uses: docker/build-push-action@v6
        with:
          context: indexer
          push: false
          tags: rahbar-indexer:ci
      - name: Build ui image
        uses: docker/build-push-action@v6
        with:
          context: ui
          push: false
          tags: rahbar-ui:ci

  scan:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build api image for scan
        uses: docker/build-push-action@v6
        with:
          context: api
          push: false
          load: true
          tags: rahbar-api:scan
      - name: Trivy scan api
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: rahbar-api:scan
          format: table
          exit-code: '1'
          severity: HIGH,CRITICAL
          ignore-unfixed: true

  e2e-eval:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - name: Install k3d
        run: |
          curl -s https://raw.githubusercontent.com/k3d-io/k3d/main/install.sh | bash
      - name: Create k3d cluster
        run: k3d cluster create rahbar-ci --wait
      - name: Install kustomize
        run: |
          curl -s "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash
          sudo mv kustomize /usr/local/bin/
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build and import images
        run: |
          docker build -t rahbar-api:ci api/
          docker build -t rahbar-indexer:ci indexer/
          docker build -t rahbar-ui:ci ui/
          k3d image import rahbar-api:ci rahbar-indexer:ci rahbar-ui:ci -c rahbar-ci
      - name: Apply manifests (dev overlay with ci image tags)
        run: |
          kubectl apply -k k8s/overlays/dev/
          kubectl create secret generic rahbar-secret -n rahbar --from-literal=LLM_API_KEY=stub || true
      - name: Run indexer Job with fixture corpus
        run: |
          kubectl create configmap corpus-config -n rahbar --from-file=eval/fixtures/ || true
          kubectl create job indexer-ci --image=rahbar-indexer:ci -n rahbar \
            --env="EMBED_MODEL=nomic-embed-text" \
            --env="CHROMA_HOST=chroma" --env="CHROMA_PORT=8000" \
            --env="CHROMA_COLLECTION=rahbar" --env="CORPUS_DIR=/fixtures" \
            --env="OLLAMA_URL=http://localhost:11434" \
            -- python -m pipeline.run --dummy || true
          kubectl wait --for=condition=complete job/indexer-ci -n rahbar --timeout=120s || true
      - name: Wait for api rollout
        run: kubectl rollout status deployment/api -n rahbar --timeout=120s
      - name: Run eval gate
        run: |
          API_URL=$(kubectl get ingress rahbar -n rahbar -o jsonpath='{.status.loadBalancer.ingress[0].ip}')
          pip install httpx pyyaml
          python eval/run_eval.py --api http://${API_URL:-localhost} \
            --golden eval/fixtures/golden.fixture.yaml \
            --baseline eval/baseline.json
