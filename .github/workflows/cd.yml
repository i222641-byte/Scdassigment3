name: CD
on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  build-push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build and push api
        uses: docker/build-push-action@v6
        with:
          context: api
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/rahbar-api:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/rahbar-api:latest
      - name: Build and push indexer
        uses: docker/build-push-action@v6
        with:
          context: indexer
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/rahbar-indexer:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/rahbar-indexer:latest
      - name: Build and push ui
        uses: docker/build-push-action@v6
        with:
          context: ui
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/rahbar-ui:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/rahbar-ui:latest

  deploy:
    needs: build-push
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Install k3d
        run: curl -s https://raw.githubusercontent.com/k3d-io/k3d/main/install.sh | bash
      - name: Create ephemeral cluster
        run: k3d cluster create rahbar-deploy --wait
      - name: Install kustomize
        run: |
          curl -s "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash
          sudo mv kustomize /usr/local/bin/
      - name: Import images
        run: |
          docker pull ${{ secrets.DOCKERHUB_USERNAME }}/rahbar-api:${{ github.sha }}
          docker pull ${{ secrets.DOCKERHUB_USERNAME }}/rahbar-indexer:${{ github.sha }}
          docker pull ${{ secrets.DOCKERHUB_USERNAME }}/rahbar-ui:${{ github.sha }}
          k3d image import \
            ${{ secrets.DOCKERHUB_USERNAME }}/rahbar-api:${{ github.sha }} \
            ${{ secrets.DOCKERHUB_USERNAME }}/rahbar-indexer:${{ github.sha }} \
            ${{ secrets.DOCKERHUB_USERNAME }}/rahbar-ui:${{ github.sha }} \
            -c rahbar-deploy
      - name: Apply manifests
        run: |
          kubectl apply -k k8s/overlays/prod/
          kubectl create secret generic rahbar-secret -n rahbar \
            --from-literal=LLM_API_KEY=${{ secrets.LLM_API_KEY }} || true
      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/api -n rahbar --timeout=180s
          kubectl rollout status deployment/ui -n rahbar --timeout=60s
      - name: Smoke test
        run: |
          kubectl port-forward svc/api 8080:80 -n rahbar &
          sleep 5
          curl -f http://localhost:8080/healthz
          curl -f -X POST http://localhost:8080/api/ask \
            -H "Content-Type: application/json" \
            -d '{"question": "What is the attendance requirement?"}' | grep -q "answer"
